<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horitoki Saree 2026 - Instant Load</title>
    
    <!-- Preconnect for speed -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap');
        :root { --gold: #d4af37; --bg: #000; }
        body { background: var(--bg); margin: 0; font-family: 'Hind Siliguri', sans-serif; color: #eee; overflow: hidden; }
        
        header { background: rgba(10, 10, 10, 0.95); padding: 10px; text-align: center; border-bottom: 1px solid #222; position: relative; z-index: 100; }
        .main-title { color: var(--gold); font-size: 16px; margin: 0; text-transform: uppercase; }

        #viewport { width: 100vw; height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; position: relative; }
        #flipbook { width: 100%; height: 100%; visibility: hidden; }

        .product-card { 
            width: 90%; height: 80%; background: #080808; border: 1px solid #222; 
            margin: auto; border-radius: 8px; position: relative; overflow: hidden;
        }
        .product-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .badge { position: absolute; top: 10px; right: 10px; background: var(--gold); color: #000; padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; z-index: 5; }

        .actions { display: flex; gap: 8px; width: 90%; margin: 10px auto; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 13px; }
        .btn-order { background: #25D366; color: white; }
        .btn-details { background: #222; color: white; border: 1px solid #333; }

        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 30px; height: 30px; border: 3px solid #222; border-top-color: var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; padding: 8px 0; border-top: 1px solid #222; }
        .marquee { white-space: nowrap; animation: move 20s linear infinite; color: var(--gold); font-size: 12px; display: inline-block; }
        @keyframes move { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <header>
        <h1 class="main-title">হরিতকী ঈদ কালেকশন ২০২৬</h1>
        <div style="font-size: 10px; color: #666;">শাড়ি কোড: <span id="pCount">1/316</span></div>
    </header>

    <div id="viewport">
        <div id="flipbook"></div>
    </div>

    <footer>
        <div class="marquee">🚚 সারাদেশে ক্যাশ অন ডেলিভারি | যেকোনো শাড়ি মাত্র ১৬৯০ টাকা! সীমিত স্টক।</div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

    <script>
        const totalImages = 316;
        const repoPath = "https://cdn.jsdelivr.net/gh/horitokidev/horitoki-catalogue@main/images/";
        let ids = Array.from({length: totalImages}, (_, i) => i + 1);

        // 1. Shuffle
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        shuffle(ids);

        // 2. High Priority Loading for first 20
        const flipbook = $('#flipbook');
        let html = '';

        ids.forEach((id, index) => {
            // প্রথম ২০টি ইমেজের জন্য স্পেশাল ট্রিটমেন্ট
            const isPriority = index < 20;
            const loadingAttr = isPriority ? 'eager' : 'lazy';
            const priorityAttr = isPriority ? 'fetchpriority="high"' : '';
            
            html += `
                <div class="page">
                    <div class="product-card">
                        <span class="badge">কোড: ${id}</span>
                        <img src="${repoPath}${id}.webp" 
                             ${priorityAttr} 
                             loading="${loadingAttr}" 
                             decoding="${isPriority ? 'sync' : 'async'}"
                             onerror="this.src='${repoPath}${id}.png'">
                    </div>
                    <div class="actions">
                        <button class="btn btn-details">বিস্তারিত</button>
                        <button class="btn btn-order">অর্ডার দিন</button>
                    </div>
                </div>`;
        });

        flipbook.html(html);

        // 3. Initialize Turn.js
        $(window).on('load', function() {
            const w = $(window).width();
            flipbook.turn({
                width: w > 500 ? 400 : w * 0.95,
                height: $(window).height() - 130,
                display: 'single',
                acceleration: true,
                duration: 500,
                when: {
                    turned: function(e, page) {
                        $('#pCount').text(page + '/' + totalImages);
                    }
                }
            });

            $('#loader').fadeOut(200);
            flipbook.css('visibility', 'visible');
        });

        // Touch prevent for smooth scroll
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
